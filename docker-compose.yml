services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flowbudget
      POSTGRES_PASSWORD: flowbudget
      POSTGRES_DB: flowbudget
    ports:
      - '5433:5432'
    volumes:
      - flowbudget_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowbudget -d flowbudget']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  flowbudget_postgres:
